name: NexaPy CI Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  python-test:
    name: Python ${{ matrix.python-version }} Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest test suite
        run: |
          python -m pytest

  sdk-compile-test:
    name: SDK Generation & Compilation Check (JS, TS, React)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install NexaPy and TypeScript tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          npm init -y
          npm install --save-dev typescript @types/react react

      - name: Verify JavaScript SDK Generation & Syntax
        run: |
          nexapy sdk generate --lang javascript --output dist_sdk_js
          node --check dist_sdk_js/client.js

      - name: Verify TypeScript SDK Generation & Compilation
        run: |
          nexapy sdk generate --lang typescript --output dist_sdk_ts
          npx tsc --noEmit --target ES2020 --moduleResolution node dist_sdk_ts/client.ts

      - name: Verify React Hook SDK Generation & Compilation
        run: |
          nexapy sdk generate --lang react --output dist_sdk_react
          npx tsc --noEmit --target ES2020 --module ESNext --moduleResolution node --jsx react-jsx --lib ES2020,DOM dist_sdk_react/react/useNexaPy.ts


