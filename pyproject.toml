[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexapy"
version = "0.1.0"
description = "A modern Python framework with FastAPI integration and AI auto-routing"
readme = "README.md"
authors = [
    { name = "NexaPy Team", email = "info@nexapy.dev" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["fastapi", "ai", "freemodel", "gemini", "framework", "llm", "routing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "build>=0.10.0",
    "twine>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/nexapy/nexapy"
Repository = "https://github.com/nexapy/nexapy.git"
Documentation = "https://github.com/nexapy/nexapy#readme"
Issues = "https://github.com/nexapy/nexapy/issues"

[project.scripts]
nexapy = "nexapy.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
